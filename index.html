<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">UNDER CONSTRUCTION</h1>
        
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="eta">
                <div class="eta-label">ETA:</div>
                <div class="eta-date" id="etaDate">2026-03-15</div>
                <div class="countdown" id="countdown">000:00:00:00</div>
            </div>
        </div>

        <div class="contact-section">
            <h2>GET NOTIFIED</h2>
            <div class="toggle-container">
                <button class="toggle-btn" id="emailToggle">EMAIL</button>
                <button class="toggle-btn" id="messageToggle">MESSAGE</button>
            </div>
            <div class="contact-content">
                <form id="contactForm">
                    <input type="email" id="emailInput" placeholder="your@email.com" required>
                    <button type="submit">SUBMIT</button>
                </form>
                <div class="message-options" id="messageOptions">
                    <button id="whatsappBtn">WHATSAPP</button>
                    <button id="smsBtn">SMS</button>
                </div>
            </div>
        </div>

        <div class="social-links">
            <a href="https://linkedin.com/in/riosisraelg" target="_blank">LINKEDIN</a>
            <span class="separator">|</span>
            <a href="https://github.com/riosisraelg" target="_blank">GITHUB</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
